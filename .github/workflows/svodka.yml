name: Denní Threat Intelligence Svodka

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Stažení repozitáře
        uses: actions/checkout@v4

      - name: Nastavení Pythonu 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalace závislostí
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Spuštění Threat Intel skriptu
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python svodka.py

      - name: Commit a Push vygenerované svodky do docs/
        run: |
          git config --global user.name "svodka-bot"
          git config --global user.email "svodka-bot@users.noreply.github.com"
          git add docs/
          if git diff --staged --quiet; then
            echo "Žádné změny k uložení."
          else
            git commit -m "chore(intel): automatická aktualizace svodky $(date -u +'%Y-%m-%d')"
            git push
          fi
