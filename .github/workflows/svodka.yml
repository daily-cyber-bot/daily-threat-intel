name: Denní Threat Intelligence Svodka

on:
  schedule:
    # 05:40 UTC = 06:40 v ČR v zimním čase (UTC+1), 07:40 v letním čase (UTC+2)
    - cron: '40 5 * * *'
  workflow_dispatch:

# Výchozí oprávnění pro celý workflow: jen čtení.
permissions:
  contents: read

concurrency:
  group: svodka-pages
  cancel-in-progress: false

jobs:
  generate:
    # Job má přístup k GEMINI_API_KEY a zpracovává nedůvěryhodná data z internetu,
    # ale NEMÁ právo zapisovat do repozitáře (contents: read, persist-credentials: false) ani nasazovat Pages.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Stažení repozitáře (bez uložení tokenu na disk)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Nastavení Pythonu 3.12
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalace závislostí
        run: |
          python -m pip install --upgrade pip
          pip install -rRequirements.txt 2>/dev/null || pip install -r requirements.txt

      - name: Spuštění Threat Intel skriptu
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python svodka.py

      - name: Upload vygenerovaného docs/ (bez API klíče)
        uses: actions/upload-artifact@v4
        with:
          name: docs-output
          path: docs/
          include-hidden-files: true
          retention-days: 1

  commit:
    # Samostatný job s právem zápisu do repozitáře, který ale nevidí GEMINI_API_KEY
    # a nespouští žádný externí Python kód z PyPI.
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Stažení repozitáře
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Stažení vygenerovaného docs/
        uses: actions/download-artifact@v4
        with:
          name: docs-output
          path: docs/

      - name: Commit a Push JSON archivu (záloha dat)
        run: |
          touch docs/.nojekyll
          git config --global user.name "svodka-bot"
          git config --global user.email "svodka-bot@users.noreply.github.com"
          git add docs/
          if git diff --staged --quiet; then
            echo "Žádné změny k uložení."
          else
            git commit -m "chore(intel): automatická záloha svodky $(date -u +'%d.%m.%Y')"
            git push
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ./docs

  deploy:
    # Samostatný job jen pro nasazení na GitHub Pages.
    needs: commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
