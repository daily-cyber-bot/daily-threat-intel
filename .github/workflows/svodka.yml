name: Denní Threat Intelligence Svodka

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: svodka-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Stažení repozitáře
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Nastavení Pythonu 3.12
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalace závislostí
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Spuštění Threat Intel skriptu
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python svodka.py

      - name: Commit a Push JSON archivu (záloha dat)
        run: |
          git config --global user.name "svodka-bot"
          git config --global user.email "svodka-bot@users.noreply.github.com"
          git add docs/
          if git diff --staged --quiet; then
            echo "Žádné změny k uložení."
          else
            git commit -m "chore(intel): automatická záloha svodky $(date -u +'%d.%m.%Y')"
            git push
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ./docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
